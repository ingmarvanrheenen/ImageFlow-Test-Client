<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Workspace | ImageFlow</title>
    <link rel="stylesheet" href="style/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono&display=swap"
        rel="stylesheet">
</head>

<body>

    <header class="main-header">
        <div class="logo">
            <span class="brand">ImageFlow</span>
            <span class="tag">API Inspector</span>
        </div>
        <div class="header-actions">
            <button class="btn btn-secondary" onclick="setLocalConfig()">Local</button>
            <button class="btn btn-secondary" onclick="setProductionConfig()">Direct (Render)</button>
            <button class="btn btn-secondary" onclick="setRapidApiConfig()">RapidAPI Proxy</button>
        </div>
    </header>

    <div class="app-container">
        <main class="request-pane">
            <section class="section-block">
                <h2 class="section-title">Gateway Configuration</h2>
                <div class="form-group">
                    <label>Base URL</label>
                    <input type="url" id="apiUrl" value="https://imageflow-api.onrender.com">
                </div>
                <div class="grid-2">
                    <div class="form-group">
                        <label id="secretLabel">Proxy Secret</label>
                        <input type="password" id="proxySecret" placeholder="Secret key...">
                    </div>
                    <div class="form-group">
                        <label>User ID</label>
                        <input type="text" id="apiUser" value="test-user-123">
                    </div>
                </div>
                <div class="form-group">
                    <label>Subscription</label>
                    <input type="text" id="apiSubscription" value="BASIC">
                </div>
            </section>

            <section class="section-block">
                <h2 class="section-title">Endpoints</h2>
                <div class="endpoint-list">

                    <article class="endpoint-card">
                        <div class="card-header">
                            <span class="badge get">GET</span>
                            <h3>System Health</h3>
                        </div>
                        <button class="btn btn-primary" onclick="testHealth()">Run Test</button>
                    </article>

                    <article class="endpoint-card">
                        <div class="card-header">
                            <span class="badge post">POST</span>
                            <h3>Generate QR Code</h3>
                        </div>
                        <div class="form-group">
                            <label>Data to Encode</label>
                            <input type="text" id="qrData" value="https://rapidapi.com">
                        </div>
                        <div class="form-group">
                            <label>Size (px)</label>
                            <input type="number" id="qrSize" value="300">
                        </div>
                        <button class="btn btn-primary" onclick="generateQRCode()">Generate</button>
                    </article>

                    <article class="endpoint-card">
                        <div class="card-header">
                            <span class="badge post">POST</span>
                            <h3>Read QR Code</h3>
                        </div>
                        <div class="file-area">
                            <input type="file" id="qrImage" accept="image/*"
                                onchange="updateFileName('qrImage', 'qrFileName')">
                            <label for="qrImage" class="file-label">Choose QR Image</label>
                            <span id="qrFileName" class="file-name"></span>
                        </div>
                        <button class="btn btn-primary mt-10" onclick="readQRCode()">Decode Image</button>
                    </article>

                    <article class="endpoint-card">
                        <div class="card-header">
                            <span class="badge post">POST</span>
                            <h3>Optimize Image</h3>
                        </div>
                        <div class="file-area">
                            <input type="file" id="optimizeImage" accept="image/*"
                                onchange="updateFileName('optimizeImage', 'optName')">
                            <label for="optimizeImage" class="file-label">Choose Image</label>
                            <span id="optName" class="file-name"></span>
                        </div>
                        <div class="grid-2 mt-10">
                            <div class="form-group">
                                <label>Quality (1-100)</label>
                                <input type="number" id="optimizeQuality" value="80">
                            </div>
                            <div class="form-group">
                                <label>Max Width</label>
                                <input type="number" id="optimizeMaxWidth" placeholder="Original">
                            </div>
                        </div>
                        <button class="btn btn-primary" onclick="optimizeImage()">Optimize</button>
                    </article>

                    <article class="endpoint-card">
                        <div class="card-header">
                            <span class="badge post">POST</span>
                            <h3>Convert Image</h3>
                        </div>
                        <div class="file-area">
                            <input type="file" id="convertImage" accept="image/*"
                                onchange="updateFileName('convertImage', 'convName')">
                            <label for="convertImage" class="file-label">Choose Image</label>
                            <span id="convName" class="file-name"></span>
                        </div>
                        <div class="form-group mt-10">
                            <label>Format</label>
                            <select id="convertFormat" class="custom-select">
                                <option value="jpeg">JPEG</option>
                                <option value="png">PNG</option>
                                <option value="webp">WebP</option>
                            </select>
                        </div>
                        <button class="btn btn-primary" onclick="convertImage()">Convert</button>
                    </article>

                    <article class="endpoint-card">
                        <div class="card-header">
                            <span class="badge post">POST</span>
                            <h3>Watermark Image</h3>
                        </div>
                        <div class="file-area">
                            <input type="file" id="watermarkMainImage" accept="image/*"
                                onchange="updateFileName('watermarkMainImage', 'wmMainName')">
                            <label for="watermarkMainImage" class="file-label">Choose Base Image</label>
                            <span id="wmMainName" class="file-name"></span>
                        </div>

                        <div class="grid-2 mt-10">
                            <div class="form-group">
                                <label>Watermark Type</label>
                                <select id="watermarkType" onchange="toggleWatermarkInputs()" class="custom-select">
                                    <option value="text">Text</option>
                                    <option value="image">Image</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Position</label>
                                <select id="watermarkPosition" class="custom-select">
                                    <option value="center">Center</option>
                                    <option value="bottom-right">Bottom Right</option>
                                    <option value="bottom-left">Bottom Left</option>
                                    <option value="top-right">Top Right</option>
                                    <option value="top-left">Top Left</option>
                                </select>
                            </div>
                        </div>

                        <!-- Text Inputs -->
                        <div id="wmTextInput" class="mt-10">
                            <div class="form-group">
                                <label>Watermark Text</label>
                                <input type="text" id="watermarkText" value="CONFIDENTIAL">
                            </div>
                            <div class="grid-2">
                                <div class="form-group">
                                    <label>Font Size</label>
                                    <input type="number" id="watermarkFontSize" value="40">
                                </div>
                                <div class="form-group">
                                    <label>Font Color</label>
                                    <input type="color" id="watermarkColor" value="#ffffff">
                                </div>
                            </div>
                        </div>

                        <div id="wmImageInput" class="file-area mt-10" style="display: none;">
                            <input type="file" id="watermarkOverlayImage" accept="image/*"
                                onchange="updateFileName('watermarkOverlayImage', 'wmOverlayName')">
                            <label for="watermarkOverlayImage" class="file-label">Choose Watermark Image</label>
                            <span id="wmOverlayName" class="file-name"></span>
                        </div>

                        <!-- Resize Options (Moved outside file-area to avoid display:none) -->
                        <div id="wmResizeOptions" style="display: none;">
                            <div class="form-group mt-10">
                                <label
                                    style="display: flex; align-items: center; gap: 8px; text-transform: none; color: var(--text);">
                                    <input type="checkbox" id="watermarkFullScreen" onchange="toggleResizeInputs()"
                                        style="width: auto;">
                                    Cover Full Image
                                </label>
                            </div>
                            <div class="grid-2" id="wmResizeInputs">
                                <div class="form-group">
                                    <label>Resize Width (px)</label>
                                    <input type="number" id="watermarkWidth" placeholder="Optional">
                                </div>
                                <div class="form-group">
                                    <label>Resize Height (px)</label>
                                    <input type="number" id="watermarkHeight" placeholder="Optional">
                                </div>
                            </div>
                        </div>

                        <div class="form-group mt-10">
                            <label>Opacity (0-100)</label>
                            <input type="range" id="watermarkOpacity" min="0" max="100" value="50"
                                oninput="this.nextElementSibling.value = this.value">
                            <output>50</output>
                        </div>

                        <button class="btn btn-primary mt-10" onclick="applyWatermark()">Apply Watermark</button>
                    </article>

                </div>
            </section>
        </main>

        <aside class="response-pane">
            <div class="console">
                <div class="console-header">
                    <span>Console Output</span>
                    <span id="statusBadge" class="status-pill"></span>
                </div>
                <div class="console-body">
                    <pre id="responseContent">// Ready for request...</pre>
                </div>
                <div id="imagePreview" class="preview-area">
                </div>
            </div>
        </aside>
    </div>

    <script src="js/index.js"></script>
</body>

</html>
